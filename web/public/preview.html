<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>外贸易 · 风格预览（5 套）</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Aptos", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 28px;
      background: linear-gradient(180deg, #050816, #0a1020);
      color: #e8f1ff;
    }
    header { margin-bottom: 22px; }
    h1 { margin: 0 0 8px; font-size: 24px; letter-spacing: -0.02em; }
    p { margin: 0; color: #93a8c9; font-size: 13px; line-height: 1.7; }
    code {
      padding: 2px 6px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.07);
      color: #9fd0ff;
      font-family: "Cascadia Mono", Consolas, monospace;
    }
    .hint { margin-top: 12px; font-size: 12px; color: #7b90b3; }

    /* 五宫格：2 列 × 3 行。每格里的 iframe 按桌面宽度 1440 渲染再缩放，
       这样看到的是**真实桌面布局**，而不是被挤成手机版。
       缩放用 transform 而不是缩小 viewport —— 后者会让断点生效，看到的就不是
       桌面排版了（这个区别很关键，第一版就是缩 viewport，结果五格全是窄屏版）。 */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }
    .cell {
      border: 1px solid rgba(167, 201, 255, 0.16);
      border-radius: 16px;
      background: rgba(9, 14, 26, 0.75);
      overflow: hidden;
    }
    .cell-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(167, 201, 255, 0.12);
    }
    .cell-title { font-size: 14px; font-weight: 600; }
    .cell-hint { font-size: 11px; color: #8ea4c8; }
    .cell-link {
      color: #7cc4ff;
      font-size: 11px;
      text-decoration: none;
      white-space: nowrap;
    }
    .cell-link:hover { text-decoration: underline; }

    .frame-box {
      position: relative;
      height: 420px;
      overflow: hidden;
      background: #000;
    }
    .frame-box iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 1440px;
      height: 900px;
      border: 0;
      transform-origin: top left;
      /* 420 / 900 ≈ 0.4667；宽度方向 1440×0.4667 ≈ 672，格宽约 700 刚好放下 */
      transform: scale(0.4667);
    }

    @media (max-width: 1200px) {
      .grid { grid-template-columns: minmax(0, 1fr); }
    }
  </style>
</head>
<body>
  <header>
    <h1>外贸易 · 五套布局方案</h1>
    <p>
      下面五格是**同一份代码、同一套逻辑**用五种不同的**布局结构**渲染的效果。
      每一格都是真实运行的页面（能点、能切页签），不是截图。
    </p>
    <p class="hint">
      差别不只在配色，更在结构：<b>导航位置</b>（顶部 / 左侧）、
      <b>设备怎么表现</b>（卡片 / 行列表 / 表格 / 芯片 / 砖块）、
      <b>画面占多大</b>、<b>信息层级</b>　·　
      右上角「🎨 方案」可现场切换　·　也可以混搭：<code>?layout=table&amp;theme=warm</code>
    </p>
  </header>

  <div class="grid" id="grid"></div>

  <script>
    // 与 web/src/themes/theme.ts 里的 PRESETS 保持一致
    const PRESETS = [
      { layout: "classic", theme: "neon", label: "1 · 经典", hint: "顶部标题 + 左画面右卡片墙（现状）" },
      { layout: "master-detail", theme: "light", label: "2 · 主从三栏", hint: "导航移到左侧；设备变行列表，画面独立成中栏" },
      { layout: "table", theme: "corporate", label: "3 · 表格密集", hint: "整页是一张设备表，一屏能管几十台" },
      { layout: "studio", theme: "terminal", label: "4 · 工作台", hint: "画面占约 2/3 视口；设备变芯片 + 右侧窄工具条" },
      { layout: "wall", theme: "warm", label: "5 · 设备墙", hint: "墙为主体 + 顶部预览横幅（与经典的主次相反）" }
    ];

    document.getElementById("grid").innerHTML = PRESETS.map(
      (preset) => `
        <section class="cell">
          <div class="cell-head">
            <div>
              <div class="cell-title">${preset.label}</div>
              <div class="cell-hint">${preset.hint}</div>
            </div>
            <a class="cell-link" href="/?layout=${preset.layout}&theme=${preset.theme}&preview=1" target="_blank" rel="noreferrer">全屏打开 ↗</a>
          </div>
          <div class="frame-box">
            <iframe src="/?layout=${preset.layout}&theme=${preset.theme}&preview=1" loading="lazy" title="${preset.label}"></iframe>
          </div>
        </section>
      `
    ).join("");
  </script>
</body>
</html>
